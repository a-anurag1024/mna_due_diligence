version: '3.8'

services:
  # --- Vector Database ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_server
    ports:
      - "1333:6333"  # REST API
      - "1334:6334"  # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped
    networks:
      - app_network

  # --- Metadata & State Database ---
  mysql_db:
    image: mysql:8.0
    container_name: mysql_server
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      # These values are loaded from your .env file
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- MCP Server ---
  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mcp_vdr_server
    ports:
      - "7000:8000" # Expose for external agents
    networks:
      - app_network
    volumes:
      - ./data/CUAD_v1/full_contract_pdf/pdfs:/app/data/CUAD_v1/full_contract_pdf/pdfs # MUST match the DATA_DIR path so it can read files
    environment:
      # Use Service Names as Hostnames
      DB_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql_server:3306/${MYSQL_DATABASE}
      QDRANT_URL: http://qdrant_server:6333
      COLLECTION_NAME: contracts_v1
      DATA_DIR: ./data/CUAD_v1/full_contract_pdf/pdfs
      EMBEDDING_MODEL: BAAI/bge-m3
      DEVICE: cpu  # Force CPU inside this container
  
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app_network

networks:
  app_network: # Renamed from 'qdrant_network' to be more generic since it now hosts both
    driver: bridge

volumes:
  mysql_data: